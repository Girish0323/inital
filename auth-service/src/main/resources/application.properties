spring.application.name=auth-service
server.port=8081
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
logging.structured.format.console=logstash
logging.structured.json.add.service=auth-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotelsaas}
spring.datasource.username=${DB_USER:hotelsaas}
spring.datasource.password=${DB_PASSWORD:local_dev_only}
spring.flyway.enabled=true
spring.flyway.schemas=auth,tenant,core,billing,audit
spring.flyway.default-schema=auth
spring.flyway.locations=classpath:db/migration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
security.jwt.secret-base64=${JWT_SECRET_BASE64:}
security.jwt.key-id=${JWT_KEY_ID:local-ephemeral}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
