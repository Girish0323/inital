spring.application.name=gateway
server.port=8080
management.endpoints.web.exposure.include=health,info
spring.cloud.gateway.server.webflux.routes[0].id=health
spring.cloud.gateway.server.webflux.routes[0].uri=forward:/actuator/health
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/health
logging.structured.format.console=logstash
logging.structured.json.add.service=gateway
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
spring.main.web-application-type=reactive

spring.cloud.gateway.server.webflux.routes[1].id=auth
spring.cloud.gateway.server.webflux.routes[1].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/auth/**

